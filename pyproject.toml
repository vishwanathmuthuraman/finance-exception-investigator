[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-exception-investigator"
version = "0.1.0"
description = "Offline synthetic research components for finance-exception-investigator"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
fei = "finance_exception_investigator.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "Markdown==3.10.3"]

[tool.setuptools]
packages = ["finance_exception_investigator", "finance_exception_investigator.schemas"]
package-dir = {"finance_exception_investigator" = "src/finance_exception_investigator", "finance_exception_investigator.schemas" = "schemas"}

[tool.setuptools.package-data]
"finance_exception_investigator.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
